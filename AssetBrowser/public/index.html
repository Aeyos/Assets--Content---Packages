<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Asset Browser</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Asset Browser</h1>
    <div class="searchbar">
      <input id="search" type="search" placeholder="Search assets by name or pack..." autocomplete="off" />
      <button id="rescan" title="Re-scan the Assets folder for changes">Rescan</button>
    </div>
    <label class="toggle" title="Show assets you've hidden from the browser">
      <input id="show-hidden" type="checkbox" />
      <span>Show hidden</span>
    </label>
  </header>

  <main>
    <aside id="filters">
      <div class="filter-group">
        <h2>Tags</h2>
        <div id="pills-tags" class="pills pills-scroll"></div>
      </div>
      <div class="filter-group">
        <h2>Theme</h2>
        <div id="pills-theme" class="pills"></div>
      </div>
      <div class="filter-group">
        <h2>Pack</h2>
        <div id="pills-pack" class="pills pills-scroll"></div>
      </div>
      <div class="filter-group">
        <h2>Category</h2>
        <div id="pills-category" class="pills"></div>
      </div>
      <button id="clear-filters">Clear all filters</button>
    </aside>

    <section id="results">
      <div id="status-bar">
        <div id="status"></div>
        <button id="regen-all" type="button" title="Regenerate the preview for every renderable item currently shown by the filters/search, one at a time">Regenerate all previews</button>
      </div>
      <div id="grid" class="grid"></div>
      <button id="load-more" class="load-more" hidden>Show more</button>
    </section>
  </main>

  <datalist id="known-tags"></datalist>

  <script src="app.js"></script>
</body>
</html>
